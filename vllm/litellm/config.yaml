# LiteLLM proxy: single OpenAI-compatible gateway in front of vLLM.
# Used by LibreChat (internal network) and by IDE clients (Cline, Copilot BYOK) on port 4000.
model_list:
  # Keep the vLLM model id as the public name so existing LibreChat conversations keep working.
  - model_name: Qwen/Qwen3.8-27B
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3.8-27B
      api_base: http://vllm:7000/v1
      api_key: dummy
    model_info:
      supports_function_calling: true
      supports_tool_choice: true
      supports_reasoning: true

litellm_settings:
  # Silently drop OpenAI params vLLM does not understand instead of failing the request
  drop_params: true
  request_timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
